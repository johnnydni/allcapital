[package]
name = "allcapital"
version = "0.1.0"
description = "All Capital – Das Zuhause der privaten Finanzen"
edition = "2021"
rust-version = "1.77"

[lib]
name = "allcapital_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = { version = "0.5", features = ["std"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
chacha20poly1305 = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
